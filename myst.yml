
version: 1

project:
  id: 5eae42df-5f18-4619-b9d9-8a56f17a08be
  title: Digital IGCSE Mathematics Core and Extended
  description: An interactive IGCSE Mathematics textbook with notes, worked examples, practice, revision, and examination-style exercises.
  keywords: [jupyter, jupyterbook, mystmd, jupyterlite, pyodide]
  authors:
    - name: Hein Htet Aung (Elio)
      github: E1io777
  github: https://github.com/E1io777/IGCSE_Mathematics_C-E
  license:
    code: MIT
    content: CC-BY-4.0

  jupyter:
    lite: true
    binder: null

  banner: media/images/banner_image.png

  plugins:
    - plugins/pyodide-block.mjs

  toc:
    - file: intro.md

    - title: Chapter 1 — Number
      children:
        - title: 1.1 Arithmetic
          file: chapter1/1.1 - Arithmetic.md
        - title: 1.2 Negative Numbers
          file: chapter1/1.2 - Negative Numbers.md
        - title: 1.3 Number Facts
          file: chapter1/1.3 - Numbers Fact.md
        - title: 1.4 Sequences
          file: chapter1/1-4-sequences.md
        - title: 1.5 Approximations and Estimation
          file: chapter1/1-5-approximations-estimation.md
        - title: 1.6 Indices
          file: chapter1/1-6-indices.md
        - title: 1.7 Standard Form
          file: chapter1/1-7-standard-form.md
        - title: 1.8 Surds
          file: chapter1/1-8-surds.md
        - title: 1.9 Calculator
          file: chapter1/1-9-calculator.md
        - title: Revision Exercise
          file: chapter1/revision-exercise.md
        - title: Examination-Style Exercise
          file: chapter1/examination-style-exercise.md

    - title: Chapter 2 — Algebra
      children:
        - title: 2.1 Algebraic Expressions
          file: chapter2/2.1 - Algebraic Expressions.md

site:
  template: book-theme
  options:
    logo: media/images/elio math banner.png
    favicon: media/images/elio math logo.png
    folders: true
    style: media/custom.css
    scripts:
      - _static/pyodide-runner.js
      - _static/pyodide-transform.js
